<!DOCTYPE html>
<html>

<head>
    <title>AR Store</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        .header {
            background-color: black;
            color: white;
            padding: 15px;
            font-size: 24px;
        }

        .product {
            background: white;
            margin: 20px auto;
            width: 250px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: green;
        }

        button {
            background-color: orange;
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkorange;
        }
    </style>

</head>

<body>

    <!-- HEAD PART COMPLETE -->

    <div class="header">
        AR Store Online Shop
    </div>

    <!-- BODY START -->

    <h1>Welcome to My Store</h1>
    <p>Best quality products available</p>

    <div class="product">
        <h2>Fancy Watch</h2>
        <p>Price: 1500 PKR</p>

        <button onclick="alert('Order Placed!')">
            Buy Now
        </button>
    </div>

</body>

</html>
